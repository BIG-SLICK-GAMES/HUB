<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BSG Login | Big Slick Games</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: #101821;
      --panel-2: #0b121a;
      --line: rgba(255, 255, 255, .12);
      --text: #f7fbff;
      --soft: #b6c4cf;
      --muted: #7f8d99;
      --gold: #f4b64a;
      --orange: #f27a1a;
      --green: #2fbf71;
      --danger: #ff7d7d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: start center;
      padding: max(10px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% -80px, rgba(244, 182, 74, .24), transparent 260px),
        linear-gradient(180deg, #071018 0%, #0b151e 48%, #05080d 100%);
    }

    main {
      width: min(calc(100vw - 24px), 366px);
      max-width: 366px;
      min-height: calc(100svh - 28px);
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .brand-row {
      min-height: 76px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .brand {
      width: min(174px, 52vw);
      display: inline-grid;
      align-items: center;
    }

    .brand img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back-link,
    button,
    .secondary-action,
    .game-action {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .back-link,
    .secondary-action,
    .game-action {
      color: var(--soft);
      background: rgba(255, 255, 255, .07);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .panel {
      width: 100%;
      display: grid;
      gap: 16px;
      padding: 18px;
      border: 1px solid rgba(244, 182, 74, .3);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .075), transparent 42%),
        linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .06);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
    }

    .mode a {
      min-height: 38px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }

    .mode a.is-active {
      color: #160a00;
      background: linear-gradient(180deg, var(--gold), var(--orange));
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: 24px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 6px 0 0;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.4;
    }

    form,
    label,
    .actions {
      display: grid;
      gap: 12px;
    }

    label {
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 50px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 8px;
      padding: 0 14px;
      background: rgba(255, 255, 255, .075);
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(244, 182, 74, .16);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      color: var(--soft);
      font-size: 12px;
      font-weight: 800;
    }

    .remember input {
      width: 16px;
      min-height: 16px;
      accent-color: var(--gold);
    }

    button {
      width: 100%;
      min-height: 50px;
      color: #160a00;
      background: linear-gradient(180deg, var(--gold), var(--orange));
      box-shadow: 0 12px 26px rgba(242, 122, 26, .28);
    }

    button:disabled {
      cursor: wait;
      opacity: .72;
      filter: saturate(.75);
    }

    .status {
      min-height: 18px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .status.is-success {
      color: var(--green);
    }

    .secondary-action {
      width: 100%;
    }

    .game-action {
      width: 100%;
      color: #06120b;
      background: linear-gradient(180deg, #41ef94, #22bc66);
      box-shadow: 0 12px 26px rgba(34, 188, 102, .24);
    }
  </style>
</head>
<body>
  <main>
    <header class="brand-row">
      <a class="brand" href="../index.html" aria-label="Big Slick Games home">
        <img src="../assets/bsg-logo-center.png?v=20260726a" alt="Big Slick Games">
      </a>
      <a class="back-link" href="../index.html">Back</a>
    </header>

    <section class="panel" aria-label="Big Slick Games login">
      <nav class="mode" aria-label="Authentication mode">
        <a class="is-active" href="./">Sign in</a>
        <a href="https://21-holdem.com/register">Create account</a>
      </nav>

      <div>
        <h1>Sign in to Big Slick Games</h1>
        <p>Use your BSG account for the hub, wallet, and live games.</p>
      </div>

      <form id="loginForm" autocomplete="on" novalidate>
        <label>
          Email
          <input id="loginId" name="sEmail" type="email" autocomplete="username" inputmode="email" required>
        </label>

        <label>
          Password
          <input id="password" name="sPassword" type="password" autocomplete="current-password" required>
        </label>

        <label class="remember">
          <input id="remember" type="checkbox" checked>
          Keep me signed in
        </label>

        <div class="actions">
          <button id="submitButton" type="submit">Sign in securely</button>
          <a class="game-action" href="https://21-holdem.com/lobby">Take me directly to 21 Hold'em</a>
          <a class="secondary-action" href="https://21-holdem.com/register">Create BSG account</a>
        </div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const statusNode = document.getElementById('status');
    const submitButton = document.getElementById('submitButton');
    const remember = document.getElementById('remember');

    function setCookie(name, value, days) {
      const maxAge = days ? `; max-age=${days * 24 * 60 * 60}` : '';
      const secure = window.location.protocol === 'https:' ? '; secure' : '';
      document.cookie = `${name}=${encodeURIComponent(value)}; path=/; SameSite=Lax${secure}${maxAge}`;
    }

    function getAuthToken(payload) {
      return payload?.data?.authorization
        || payload?.authorization
        || payload?.data?.data?.authorization
        || '';
    }

    function setStatus(message, isSuccess = false) {
      statusNode.textContent = message;
      statusNode.classList.toggle('is-success', isSuccess);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setStatus('');
      submitButton.disabled = true;
      submitButton.textContent = 'Signing in...';

      const login = document.getElementById('loginId').value.trim();
      const password = document.getElementById('password').value;

      if (!login || !password) {
        setStatus('Enter your email and password.');
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in securely';
        return;
      }

      try {
        const response = await fetch('https://21-holdem.com/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sEmail: login,
            sPassword: password,
          }),
        });
        const payload = await response.json().catch(() => ({}));
        const token = getAuthToken(payload);

        if (!response.ok || !token) {
          setStatus(payload?.message || payload?.data?.message || 'Sign in failed.');
          return;
        }

        setCookie('sAuthToken', token, remember.checked ? 14 : undefined);
        setStatus('Signed in. Loading the hub...', true);
        window.location.assign('../index.html');
      } catch (error) {
        setStatus('Login service is not reachable.');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in securely';
      }
    });
  </script>
</body>
</html>
